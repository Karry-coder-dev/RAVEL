project_name: interactive_retrieval
run_name: main_experiment
wandb_enable: false

img_aug: true
dataset_name: Interactive-PEDES
data_dir: ./dataset/interactive-pedes
llava_config_file: ./code/main/config/train_question.yaml
max_retrieve_length: 192
interact_round: 5
num_candidates: 4
stage: train_retriever

stage_config:
  train_retriever:
    num_epoch: 30
    batch_size: 32
    lr: 1.0e-5

  prepare_data:
    interact_round: 5
    batch_size: 256

  warmup_selector:
    batch_size: 64
    num_epoch: 10
    warmup_epochs: 0
    lr: 1.0e-5
    bias_lr_factor: 1.0

  train_selector:
    llava_config_file: ./code/main/config/train_selector.yaml
    selector_model_path: null

  eval:
    answerer_base_url: http://localhost:10500/v1
    answerer_api_key: Qwen-7B
    answer_max_tokens: 64
    batch_size: 40
    interact_round: 5
    project_name: Interactive_eval

    # The module only needs this existing path to satisfy the evaluator; the
    # GPT-5.6 Luna HTTP questioner is used instead of loading this checkpoint.
    question_model_path: ./weight/reference-model
    questioner_type: openai_vision
    questioner_api_url: http://127.0.0.1:18081
    questioner_api_timeout: 7200
    questioner_image_max_side: 768
    questioner_jpeg_quality: 90
    round_state_path: ./dataset/evaluation-records/rl-analysis/gpt56_luna_top4_round_state.pt
    selector_model_path: null
    checkpoint_name: gpt56_luna_top4
    questioner_rank1_only: false
    questioner_shuffle_top4: false
    wandb_enable: false
